repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        types_or: [javascript, html, css, markdown, yaml, json]

      - id: validate-bank
        name: validate question bank
        entry: node validate.mjs
        language: system
        pass_filenames: false
        files: ^questions\.js$

      - id: test-escape
        name: test HTML escaping
        entry: node test-escape.mjs
        language: system
        pass_filenames: false
        files: ^(app\.js|test-escape\.mjs)$
